services:
  sightglass-api:
    build:
      context: .
      dockerfile: api/Dockerfile.cpu
    ports:
      - "8000:8000"
    environment:
      - SIGHTGLASS_ALLOWED_ORIGIN=http://localhost:5173,http://127.0.0.1:5173
    volumes:
      # data/build/hydraulic (make data) and data/models/engine.pkl (scripts/train_engine.py)
      - ./data:/app/data:ro
