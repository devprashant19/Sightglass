[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sightglass"
version = "0.1.0"
description = "Machine-health time-series language model (TSLM) explaining diagnoses with verified physical evidence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Sightglass Team" }
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "fastapi>=0.100",
    "uvicorn>=0.22",
    "matplotlib>=3.7",
    "duckdb>=0.9",
    "pyarrow>=12.0",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-xdist>=3.3",
    "ruff>=0.3",
    "mypy>=1.8",
    "types-PyYAML",
    "types-requests",
    "httpx>=0.24",
    "sktime>=0.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sightglass"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "Q",   # flake8-quotes
]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = [
    "sightglass.physics.*",
    "sightglass.eval.*",
    "sightglass.rationales.*",
    "sightglass.export.*"
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "sklearn.*",
    "lightgbm.*",
    "sktime.*",
    "duckdb.*",
    "torch.*",
    "transformers.*",
    "open_flamingo.*",
    "opentslm.*",
    "timenet.*",
    "timenet_connectors.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "connector"]
pythonpath = [".", "src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require a GPU",
]
