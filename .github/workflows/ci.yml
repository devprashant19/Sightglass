name: Sightglass CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv --python 3.12
          uv pip sync requirements-lock.txt
          uv pip install --no-deps -e .

      - name: Lint and format check with ruff
        run: |
          uv run ruff check src tests scripts api connector
          uv run ruff format --check src tests scripts api connector

      - name: Type check with mypy
        run: |
          uv run mypy src/sightglass/physics src/sightglass/eval src/sightglass/rationales src/sightglass/export src/sightglass/engine.py src/sightglass/data

      - name: Run fast tests (synthetic fixtures; tests needing the real build skip)
        run: |
          uv run pytest -m "not slow and not gpu"

  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npm run typecheck

      - name: Run Vitest unit tests
        working-directory: web
        run: npm test

      - name: No hard-coded result numbers in the dashboard
        run: python scripts/check_no_hardcoded_numbers.py

      - name: Build web
        working-directory: web
        run: npm run build
